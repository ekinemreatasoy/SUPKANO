<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUPKANO Etkinliği</title>
<style>
  :root{--brand:#0077B6;}
  html,body{height:100%;margin:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:linear-gradient(160deg,#0077B6,#00B4D8);color:#fff;
       display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .card{max-width:380px;}
  .logo{font-size:2rem;font-weight:800;letter-spacing:1px;margin-bottom:8px;}
  p{opacity:.92;line-height:1.5;margin:0 0 24px;}
  .btn{display:inline-block;background:#fff;color:var(--brand);font-weight:700;
       padding:14px 24px;border-radius:14px;text-decoration:none;}
  .small{display:block;margin-top:16px;opacity:.8;font-size:.85rem;}
  .small a{color:#fff;}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">SUPKANO</div>
    <p>Etkinlik uygulamada açılıyor…<br>Uygulama yüklü değilse aşağıdan indir.</p>
    <a id="appstore" class="btn" href="#">App Store'dan İndir</a>
    <span class="small">Açılmadıysa <a id="retry" href="#">tekrar dene</a>.</span>
  </div>
<script>
  // TODO: Uygulama yayınlanınca gerçek App Store linkiyle değiştir.
  var APPSTORE_URL = "https://apps.apple.com/tr/app/idXXXXXXXXX";

  var id = new URLSearchParams(location.search).get("id");
  var appURL = id ? ("supkano://event/" + encodeURIComponent(id)) : null;

  document.getElementById("appstore").href = APPSTORE_URL;

  function openApp() {
    if (!appURL) return;
    var start = Date.now();
    // If the app opens, the page is backgrounded and this timer is cleared.
    var t = setTimeout(function () {
      if (Date.now() - start < 2000) window.location = APPSTORE_URL;
    }, 1200);
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) clearTimeout(t);
    });
    window.location = appURL;
  }

  document.getElementById("retry").addEventListener("click", function (e) {
    e.preventDefault(); openApp();
  });

  // Auto-attempt on load.
  openApp();
</script>
</body>
</html>
